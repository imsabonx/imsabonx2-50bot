services:
  - type: web
    name: sabonx2-link-checker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 8 --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_DOMAINS
        sync: false
